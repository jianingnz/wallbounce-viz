<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>New episodes</title>
<link rel="stylesheet" href="site.css?v=20260902">
<style>
  .stage{position:relative; height:520px; border:1px solid var(--line); background:#fbfaf8; overflow:hidden}
  .stage canvas{display:block; width:100%; height:100%}
  .stage .lbl{left:10px; top:8px}
  .ctl input[type=range]{accent-color:var(--ink)}
  h2{margin-top:34px}
  h2 i{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:8px; vertical-align:0}
  @media(max-width:700px){ .stage{height:380px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Two new episodes</h1>
  <p class="sub">Sand sphere and hollow elastic cube from the updated generator — same seed, so the same pose, throw and spin. 2,048 points, all 480 frames at 2.5 ms, no trimming.</p>
  <div id="sections"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="overlay.js?v=2"></script>
<script>
(function(){
  const COLORS = {sand2048: '#d3a15a', shell2048: '#3f9a94'};
  const TITLES = {sand2048: 'Sand sphere', shell2048: 'Hollow elastic cube'};
  const disc = vizDisc();
  const cm = v => (v * 100).toFixed(0);

  function makeViewer(sec, meta, buf){
    const N = meta.n_particles, T = meta.n_frames, DT_MS = meta.dt * 1000, H = meta.arena.wall_height, color = COLORS[meta.config] || '#888';
    const canvas = sec.querySelector('canvas');
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#fbfaf8');
    // arena: floor grid + box edges (floor perimeter darker than the verticals and rim)
    const grid = new THREE.GridHelper(1, 10, 0xd6d2ca, 0xe6e3dc); grid.position.set(0.5, 0, 0.5); scene.add(grid);
    const P = (x, y, z) => new THREE.Vector3(x, y, z);
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([P(0,0,0), P(1,0,0), P(1,0,1), P(0,0,1)]), new THREE.LineBasicMaterial({color: 0x444444})));
    const up = new THREE.LineBasicMaterial({color: 0xb0b0b0});
    for (const [x, z] of [[0,0],[1,0],[1,1],[0,1]]) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P(x,0,z), P(x,H,z)]), up));
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([P(0,H,0), P(1,H,0), P(1,H,1), P(0,H,1)]), new THREE.LineBasicMaterial({color: 0xcccccc})));
    const axes = new THREE.AxesHelper(0.08); axes.position.set(-0.02, 0.001, -0.02); scene.add(axes);
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({size: 0.0135, map: disc, color, transparent: true, alphaTest: 0.4, depthWrite: true, sizeAttenuation: true}));
    pts.frustumCulled = false; scene.add(pts);

    const renderer = new THREE.WebGLRenderer({canvas, antialias: true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 100);
    const controls = new THREE.OrbitControls(camera, canvas); controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 0.2; controls.maxDistance = 6; controls.maxPolarAngle = Math.PI / 2 - 0.02;
    // camera on the side the object is thrown from, three-quarter view
    const vx = meta.v0[0], vz = meta.v0[1], sp = Math.hypot(vx, vz);
    const bx = sp > 0.1 ? -vx / sp : (meta.spawn_pos[0] < 0.5 ? -1 : 1), bz = sp > 0.1 ? -vz / sp : (meta.spawn_pos[1] < 0.5 ? -1 : 1);
    camera.position.set(0.5 + bx * 1.35 - bz * 0.9, 0.95, 0.5 + bz * 1.35 + bx * 0.9); controls.target.set(0.5, 0.22, 0.5);

    const scrub = sec.querySelector('input[type=range]'), read = sec.querySelector('.frame'), lbl = sec.querySelector('.lbl .m'), playBtn = sec.querySelector('.play');
    const getSpeed = makeSpeed(sec.querySelector('.ctl'), [[1,'Real time'],[4,'¼ speed'],[10,'1/10 speed'],[25,'1/25 speed']]);
    const clock = makeClock(() => getSpeed(), 900);
    let frame = -1, playing = true; scrub.max = T - 1;
    function setFrame(f){
      frame = f; geo.attributes.position.array.set(buf.subarray(f * N * 3, (f + 1) * N * 3)); geo.attributes.position.needsUpdate = true;
      scrub.value = f; read.textContent = `${f + 1} / ${T} · ${(f * DT_MS).toFixed(1)} ms`; lbl.textContent = `t = ${(f * DT_MS / 1000).toFixed(3)} s`;
    }
    function render(){
      const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return; const pr = renderer.getPixelRatio();
      if (canvas.width !== Math.floor(w * pr) || canvas.height !== Math.floor(h * pr)){ renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
      renderer.render(scene, camera);
    }
    function loop(ts){ controls.update(); const f = Math.min(T - 1, Math.round(clock.tick(ts, playing, (T - 1) * DT_MS) / DT_MS)); if (f !== frame) setFrame(f); render(); requestAnimationFrame(loop); }
    playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };
    sec.querySelector('.replay').onclick = () => { clock.set(0); setFrame(0); playing = true; playBtn.textContent = 'Pause'; };
    scrub.oninput = function(){ playing = false; playBtn.textContent = 'Play'; setFrame(+this.value); clock.set(frame * DT_MS); };
    setFrame(0); requestAnimationFrame(loop);
  }

  function section(meta){
    const size = meta.radius ? `${cm(meta.radius * 2)} cm ⌀` : `${cm(meta.cube_size[0])} cm`;
    const s = document.createElement('section');
    s.innerHTML = `<h2><i style="background:${COLORS[meta.config]}"></i>${TITLES[meta.config] || meta.label} — ${meta.scenario} throw</h2>
      <div class="stage"><canvas></canvas><div class="lbl"><b>${meta.label}</b><br><span class="m"></span></div></div>
      <div class="ctl"><button class="play">Pause</button><button class="replay">Replay</button><input type="range" min="0" max="1" value="0" step="1"><span class="mono frame"></span></div>
      <p class="caption">${size} · launched at ${meta.speed0.toFixed(1)} m/s from ${cm(meta.spawn_pos[2])} cm, spin ${meta.spin0.toFixed(1)} rad/s · ${meta.substeps} substeps per frame · seed ${meta.seed}. Drag to orbit, scroll to zoom.</p>`;
    return s;
  }

  async function init(){
    const v = '?t=' + Date.now(), root = document.getElementById('sections');
    let index; try { index = await (await fetch('data/episodes/index.json' + v)).json(); } catch (e){ root.innerHTML = '<p class="caption">Could not load data/episodes/index.json</p>'; return; }
    const order = ['sand2048', 'shell2048'];
    index.sort((a, b) => order.indexOf(a.stem.split('_')[0]) - order.indexOf(b.stem.split('_')[0]));
    for (const e of index){
      const meta = await (await fetch(`data/episodes/${e.stem}/meta.json` + v)).json();
      const buf = new Float32Array(await (await fetch(`data/episodes/${e.stem}/pos.bin` + v)).arrayBuffer());
      const s = section(meta); root.appendChild(s); makeViewer(s, meta, buf);
    }
  }
  init();
})();
</script>
</body>
</html>
