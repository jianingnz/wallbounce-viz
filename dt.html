<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Δt study</title>
<link rel="stylesheet" href="site.css?v=20260902">
<style>#stage{height:620px}</style>
</head>
<body>
<div class="wrap">
  <h2 style="margin-top:0">All 100 validation windows</h2>
  <table id="summary"></table>
  <h2>One window under every setting</h2>
  <div class="ex" id="ex"></div>
  <table id="extable"></table>
  <div id="stage" style="margin-top:12px"><canvas id="c"></canvas><div id="labels"></div></div>
  <div class="ctl">
    <button id="play">Pause</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1">
    <span class="mono" id="clock">t = 0 ms</span>
    <button id="ovl">GT → prediction vectors</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="overlay.js?v=2"></script>
<script>
(function(){
  const PANES=[['gt','ground truth'],['fixed42','fixed-Δt model · 42 ms'],['dti42','implicit-Δt · 42 ms'],['dti84','implicit-Δt · 84 ms'],['dti125','implicit-Δt · 125 ms (never trained)'],['dti167','implicit-Δt · 167 ms']];
  const LABEL=Object.fromEntries(PANES.slice(1)); const COLS=3, ROWS=2;
  const cm=v=>(v*100).toFixed(1)+' cm';
  let meta=null, bufs={}, N=128, C=5, NAT=1000/24, tEnd=1000, ovOn=false;
  const sprite=vizDisc();
  function makeView(color){ const scene=new THREE.Scene(); scene.background=new THREE.Color('#f5f5f7'); const geo=new THREE.BufferGeometry();
    const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:0.03,map:sprite,color,transparent:true,alphaTest:0.35,depthWrite:true,sizeAttenuation:true})); pts.frustumCulled=false; scene.add(pts);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,0.8,1)),new THREE.LineBasicMaterial({color:0x8e8e93,transparent:true,opacity:0.7})); edges.position.set(0.5,0.5,0.5); scene.add(edges);
    const grid=new THREE.GridHelper(1,10,0xc7c7cc,0xe5e5ea); grid.position.set(0.5,0.1,0.5); scene.add(grid); return {scene,geo}; }
  const views=PANES.map(([k])=>makeView(k==='gt'?0x0a84ff:0xff9500));
  const ovs=PANES.map(([k],i)=>k==='gt'?null:makeOverlay(views[i].scene,sprite,0.02));
  function alloc(){ views.forEach(V=>V.geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3))); ovs.forEach(o=>o&&o.alloc(N)); }
  function frameAt(key,t){ const tA=(C-1)*NAT; if(t<tA) return Math.min(C-1,Math.floor(t/NAT));
    if(key==='gt') return Math.min(meta.gt_frames-1, C-1+Math.floor((t-tA)/NAT)); const s=meta.settings[key]; return Math.min(s.n_frames-1, C-1+Math.floor((t-tA)/s.dt_ms)); }
  function nativeIndexOf(key,f){ if(key==='gt'||f<C) return f; const s=meta.settings[key]; return Math.min(meta.gt_frames-1, C-1+Math.round((f-C+1)*s.dt_ms/NAT)); }
  function adeAt(key,f){ const g=bufs.gt,p=bufs[key],gi=nativeIndexOf(key,f); let s=0; for(let i=0;i<N;i++){const o=(f*N+i)*3,og=(gi*N+i)*3; const dx=p[o]-g[og],dy=p[o+1]-g[og+1],dz=p[o+2]-g[og+2]; s+=Math.sqrt(dx*dx+dy*dy+dz*dz);} return s/N*10; }
  let tNow=0, playing=true, last=0; const getSpeed=makeSpeed(document.getElementById('play').parentElement);
  function setTime(t){ if(!meta) return; tNow=t;
    PANES.forEach(([key],i)=>{ const f=frameAt(key,t); views[i].geo.attributes.position.array.set(bufs[key].subarray(f*N*3,f*N*3+N*3)); views[i].geo.attributes.position.needsUpdate=true;
      if(ovs[i]) ovs[i].update(bufs.gt,bufs[key],nativeIndexOf(key,f),f,N);
      const el=document.getElementById('lbl_'+key); if(el){ const ctx=f<C; el.querySelector('.m').textContent= ctx?`context ${f+1}/${C}`:(key==='gt'?`frame +${f-C+1}`:`step ${f-C+1}/${meta.settings[key].steps} · err ${adeAt(key,f).toFixed(3)} m`); } });
    document.getElementById('scrub').value=Math.round(t); document.getElementById('clock').textContent=`t = ${Math.round(t)} ms`; }
  const canvas=document.getElementById('c'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setScissorTest(true);
  const camera=new THREE.PerspectiveCamera(42,1,0.01,100); camera.position.set(1.45,0.95,1.65); const controls=new THREE.OrbitControls(camera,canvas);
  controls.target.set(0.5,0.5,0.5); controls.enableDamping=true; controls.dampingFactor=0.08; controls.minDistance=0.05; controls.maxDistance=10;
  function layoutLabels(){ const st=document.getElementById('stage'),W=st.clientWidth,H=st.clientHeight,pw=W/COLS,ph=H/ROWS,box=document.getElementById('labels');
    if(!box.children.length) PANES.forEach(([key,label])=>{const d=document.createElement('div'); d.className='lbl'; d.id='lbl_'+key; d.innerHTML=`<b>${label}</b><br><span class="m"></span>`; box.appendChild(d);});
    PANES.forEach(([key],i)=>{const el=document.getElementById('lbl_'+key); el.style.left=(i%COLS)*pw+8+'px'; el.style.top=Math.floor(i/COLS)*ph+8+'px';}); }
  function render(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return; const pr=renderer.getPixelRatio();
    if(canvas.width!==Math.floor(w*pr)||canvas.height!==Math.floor(h*pr)){renderer.setSize(w,h,false); layoutLabels();}
    const pw=Math.floor(w/COLS),ph=Math.floor(h/ROWS); camera.aspect=pw/ph; camera.updateProjectionMatrix();
    views.forEach((V,i)=>{const x=(i%COLS)*pw,y=(ROWS-1-Math.floor(i/COLS))*ph; renderer.setViewport(x,y,pw,ph); renderer.setScissor(x,y,pw,ph); renderer.render(V.scene,camera);}); }
  function loop(ts){ controls.update(); if(playing&&meta){ if(!last) last=ts; let t=tNow+(ts-last)/getSpeed(); last=ts; if(t>tEnd+700/getSpeed()) t=0; setTime(t);} else last=ts; render(); requestAnimationFrame(loop); }
  document.getElementById('play').onclick=function(){playing=!playing; this.textContent=playing?'Pause':'Play';};
  document.getElementById('scrub').oninput=function(){playing=false; document.getElementById('play').textContent='Play'; setTime(+this.value);};
  document.getElementById('ovl').onclick=function(){ovOn=!ovOn; this.classList.toggle('active',ovOn); ovs.forEach(o=>o&&o.setVisible(ovOn)); setTime(tNow);};
  async function loadExample(name){ const v='?t='+Date.now(); meta=await (await fetch(`data/dtstudy/${name}/meta.json${v}`)).json(); N=meta.n_particles; C=meta.context_len; NAT=meta.native_dt_ms;
    const keys=['gt',...Object.keys(meta.settings)]; const arrs=await Promise.all(keys.map(k=>fetch(`data/dtstudy/${name}/${k}.bin${v}`).then(r=>r.arrayBuffer())));
    bufs={}; keys.forEach((k,i)=>bufs[k]=new Float32Array(arrs[i])); alloc(); tEnd=(C-1)*NAT+Math.max(...Object.values(meta.settings).map(s=>s.steps*s.dt_ms)); document.getElementById('scrub').max=Math.round(tEnd);
    let h='<tr><th>setting</th><th>steps × Δt</th><th>window ADE</th><th>final-frame error</th></tr>';
    for(const [k,s] of Object.entries(meta.settings)) h+=`<tr><td>${LABEL[k]}</td><td>${s.steps} × ${Math.round(s.dt_ms)} ms</td><td>${cm(s.ade_m)}</td><td>${cm(s.fde_m)}</td></tr>`;
    const tb=document.getElementById('extable'); tb.innerHTML=h; markBest(tb,[2,3]);
    setTime(0); playing=true; last=0; document.getElementById('play').textContent='Pause'; }
  async function init(){ const summary=await (await fetch('data/dtstudy/summary.json?t='+Date.now())).json();
    let h='<tr><th>model · step size</th><th>steps</th><th>horizon</th><th>mean ADE</th><th>median ADE</th></tr>';
    for(const k of ['fixed42','dti42','dti84','dti125','dti167']){const s=summary[k]; if(!s) continue; h+=`<tr><td>${LABEL[k]}</td><td>${s.steps}</td><td>${s.horizon_s.toFixed(2)} s</td><td>${cm(s.mean_ade_m)}</td><td>${cm(s.median_ade_m)}</td></tr>`;}
    const tb=document.getElementById('summary'); tb.innerHTML=h; markBest(tb,[3,4]);
    const idx=await (await fetch('data/dtstudy/index.json?t='+Date.now())).json(); const ex=document.getElementById('ex');
    idx.forEach((w,i)=>{const b=document.createElement('button'); b.textContent=`#${w.rank} · ${cm(w.ade_dti42_m)}`; b.className=i===0?'active':''; b.onclick=()=>{ex.querySelectorAll('button').forEach(x=>x.className=''); b.className='active'; loadExample(w.name);}; ex.appendChild(b);});
    layoutLabels(); if(idx.length) await loadExample(idx[0].name); requestAnimationFrame(loop); }
  addEventListener('resize',layoutLabels); init();
})();
</script>
</body>
</html>
