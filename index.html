<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOVi-spheres wall bounce — one-step viewer</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#1a2432; --soft:#5c6b7f; --line:#d5dde6;
    --accent:#0e7c8c; --gt:#1f6feb; --pred:#e8710a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:10px 18px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none;
  }
  header h1{font-size:15px; font-weight:650; margin:0; letter-spacing:-.01em; white-space:nowrap}
  .tabs{display:flex; gap:6px; flex-wrap:wrap}
  .tab{
    font-size:12.5px; font-weight:600; font-family:ui-monospace,Menlo,monospace;
    padding:6px 13px; border-radius:100px; border:1px solid var(--line);
    background:var(--bg); color:var(--soft); cursor:pointer; white-space:nowrap;
  }
  .tab:hover{border-color:var(--accent); color:var(--accent)}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  header .meta{font-size:11.5px; color:var(--soft); font-family:ui-monospace,Menlo,monospace;
    flex-basis:100%; line-height:1.45}
  #stage{position:relative; flex:1; min-height:0}
  canvas{display:block; width:100%; height:100%}
  .labels{position:absolute; inset:0; pointer-events:none}
  .vlabel{
    position:absolute; top:14px; font-size:12.5px; font-weight:600;
    font-family:ui-monospace,Menlo,monospace; letter-spacing:.04em;
    padding:5px 11px; border-radius:100px; background:rgba(255,255,255,.82);
    border:1px solid var(--line); backdrop-filter:blur(3px);
  }
  .vlabel .swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  #lbl-gt{left:16px} #lbl-gt .swatch{background:var(--gt)}
  #lbl-pred{left:50%; margin-left:16px} #lbl-pred .swatch{background:var(--pred)}
  .divider{position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--line)}
  .controls{
    display:flex; align-items:center; gap:14px; padding:11px 18px;
    border-top:1px solid var(--line); background:var(--panel); flex:none;
  }
  button.play{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--accent); color:#fff; cursor:pointer; font-size:14px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  button.play:hover{filter:brightness(1.08)}
  button.play:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  input[type=range]{flex:1; accent-color:var(--accent); cursor:pointer}
  .frame{font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--soft); min-width:74px; text-align:right; font-variant-numeric:tabular-nums}
  .phase{
    font-family:ui-monospace,Menlo,monospace; font-size:11px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; border-radius:6px;
    border:1px solid var(--line); min-width:96px; text-align:center;
  }
  .phase.context{color:#5c6b7f; background:#eef1f5}
  .phase.predicted{color:var(--pred); background:#fdefe0; border-color:#f3d3ac}
  .hint{position:absolute; bottom:12px; left:16px; font-size:11.5px; color:var(--soft);
    font-family:ui-monospace,Menlo,monospace; background:rgba(255,255,255,.7); padding:3px 8px; border-radius:6px}
  #loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(238,241,245,.75); font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--soft)}
  @media(max-width:560px){ #lbl-pred{left:50%;margin-left:8px} .hint{display:none} }
</style>
</head>
<body>
  <header>
    <h1>Wall bounce — one-step prediction</h1>
    <nav class="tabs" id="tabs" aria-label="Windows"></nav>
    <span class="meta" id="meta">loading…</span>
  </header>

  <div id="stage">
    <canvas id="c"></canvas>
    <div class="labels">
      <div class="vlabel" id="lbl-gt"><span class="swatch"></span>Ground truth</div>
      <div class="vlabel" id="lbl-pred"><span class="swatch"></span>Prediction · one-step post-impact</div>
      <div class="divider"></div>
      <div class="hint">drag to orbit · scroll to zoom · both views share one camera</div>
    </div>
    <div id="loading">loading data…</div>
  </div>

  <div class="controls">
    <button class="play" id="play" aria-label="Play or pause">❚❚</button>
    <span class="phase context" id="phase">context</span>
    <input type="range" id="scrub" min="0" max="1" value="0" step="1" aria-label="Timeline">
    <span class="frame" id="frame">0 / 0</span>
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  // Windows are listed in data/index.json (written by export_overfit_viz.py);
  // one directory per window: gt.bin / pred.bin (f32 [T,N,3], three.js y-up)
  // + meta.json. Pred frames 0..C-1 are the shared GT context; frame C is the
  // model's one-step post-impact prediction (overfit checkpoint).
  const cache = {};
  let cur = null;
  let T=6, N=128, C=5, B=[[0,1],[0.1,0.9],[0,1]];
  const cx=()=> (B[0][0]+B[0][1])/2, cy=()=> (B[1][0]+B[1][1])/2, cz=()=> (B[2][0]+B[2][1])/2;
  const span=()=> B[0][1]-B[0][0];

  function disc(){
    const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
    const g=cv.getContext('2d'); const rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(.5,'rgba(255,255,255,.95)');
    rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(s/2,s/2,s/2,0,7); g.fill();
    return new THREE.CanvasTexture(cv);
  }
  const sprite=disc();

  function heightColors(buf, f, out){
    const lo=B[1][0], hi=0.65;                       // ball never rises past ~0.62
    const a=new THREE.Color('#123f8a'), b=new THREE.Color('#67d4ff'), c=new THREE.Color();
    for(let i=0;i<N;i++){
      const y=buf[(f*N+i)*3+1]; let t=(y-lo)/(hi-lo); t=Math.max(0,Math.min(1,t));
      c.copy(a).lerp(b,t); out[i*3]=c.r; out[i*3+1]=c.g; out[i*3+2]=c.b;
    }
  }

  function makeView(){
    const scene=new THREE.Scene(); scene.background=new THREE.Color('#eef1f5');
    const geo=new THREE.BufferGeometry();
    const pts=new THREE.Points(geo, new THREE.PointsMaterial({size:span()*0.028, map:sprite,
      vertexColors:true, transparent:true, alphaTest:0.35, depthWrite:true, sizeAttenuation:true}));
    scene.add(pts);
    const boxGeo=new THREE.BoxGeometry(B[0][1]-B[0][0], B[1][1]-B[1][0], B[2][1]-B[2][0]);
    const walls=new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({color:0x9db0c4,
      transparent:true, opacity:0.05, side:THREE.BackSide, depthWrite:false}));
    walls.position.set(cx(),cy(),cz()); scene.add(walls);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo),
      new THREE.LineBasicMaterial({color:0x7f93a8, transparent:true, opacity:0.55}));
    edges.position.set(cx(),cy(),cz()); scene.add(edges);
    const grid=new THREE.GridHelper(span(), 10, 0xb9c6d4, 0xd3dce5);
    grid.position.set(cx(), B[1][0], cz()); scene.add(grid);
    const ax=new THREE.AxesHelper(span()*0.32); ax.position.set(B[0][0],B[1][0],B[2][0]); scene.add(ax);
    return {scene, geo};
  }
  const V_gt=makeView(), V_pred=makeView();

  function allocBuffers(){
    for(const V of [V_gt,V_pred]){
      V.geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3),3));
      V.geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(N*3),3));
    }
  }

  function setFrame(f){
    if(!cur) return;
    for(const [V,buf] of [[V_gt,cur.gt],[V_pred,cur.pred]]){
      V.geo.attributes.position.array.set(buf.subarray(f*N*3, f*N*3+N*3));
      V.geo.attributes.position.needsUpdate=true;
      heightColors(buf,f,V.geo.attributes.color.array);
      V.geo.attributes.color.needsUpdate=true;
    }
    const isCtx = f < C;
    const ph=document.getElementById('phase');
    ph.textContent = isCtx ? `context ${f+1}/${C}` : 'predicted';
    ph.className = 'phase '+(isCtx?'context':'predicted');
    document.getElementById('frame').textContent = `${f+1} / ${T}`;
    document.getElementById('scrub').value = f;
  }

  async function loadSet(name){
    document.getElementById('loading').style.display='flex';
    if(!cache[name]){
      const meta = await (await fetch(`data/${name}/meta.json`)).json();
      const [gtB, prB] = await Promise.all([
        fetch(`data/${name}/gt.bin`).then(r=>r.arrayBuffer()),
        fetch(`data/${name}/pred.bin`).then(r=>r.arrayBuffer()),
      ]);
      cache[name] = {meta, gt:new Float32Array(gtB), pred:new Float32Array(prB)};
    }
    cur = cache[name];
    T=cur.meta.n_frames; N=cur.meta.n_particles; C=cur.meta.context_len; B=cur.meta.bounds;
    allocBuffers();
    document.getElementById('scrub').max=T-1;
    const m=cur.meta;
    document.getElementById('meta').textContent =
      `${m.dataset} · scene ${m.scene_id} · impact ${m.body} in transition ${m.j}→${m.j+1} · `+
      `${N} particles · ${C} GT context frames → 1 predicted · `+
      `pred-vs-GT point RMS ${m.rms_mm.toFixed(2)}×10⁻³ box units (≈ ${(m.rms_mm*10).toFixed(1)} mm real)`;
    frame=0; setFrame(0);
    document.getElementById('loading').style.display='none';
  }

  // shared camera + renderer, two scissored viewports
  const canvas=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setScissorTest(true);
  const camera=new THREE.PerspectiveCamera(42, 1, 0.01, 100);
  camera.position.set(cx()+span()*1.05, cy()+span()*0.5, cz()+span()*1.25);
  const controls=new THREE.OrbitControls(camera, canvas);
  controls.target.set(cx(),cy(),cz()); controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.minDistance=span()*0.4; controls.maxDistance=span()*4;

  function render(){
    const w=canvas.clientWidth, h=canvas.clientHeight, half=Math.floor(w/2);
    if(canvas.width!==Math.floor(w*renderer.getPixelRatio())) renderer.setSize(w,h,false);
    camera.aspect=half/h; camera.updateProjectionMatrix();
    renderer.setViewport(0,0,half,h); renderer.setScissor(0,0,half,h); renderer.render(V_gt.scene,camera);
    renderer.setViewport(half,0,w-half,h); renderer.setScissor(half,0,w-half,h); renderer.render(V_pred.scene,camera);
  }

  let frame=0, playing=true, last=0; const FPS=3;   // 6-frame clips: slow playback
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) playing=false;
  document.getElementById('play').textContent = playing?'❚❚':'▶';
  function loop(t){
    controls.update();
    if(playing && cur && t-last>1000/FPS){ frame=(frame+1)%T; setFrame(frame); last=t; }
    render(); requestAnimationFrame(loop);
  }
  document.getElementById('play').addEventListener('click',function(){
    playing=!playing; this.textContent=playing?'❚❚':'▶';
  });
  document.getElementById('scrub').addEventListener('input',function(){
    playing=false; document.getElementById('play').textContent='▶';
    frame=+this.value; setFrame(frame);
  });

  fetch('data/index.json').then(r=>r.json()).then(list=>{
    const tabs=document.getElementById('tabs');
    list.forEach((w,i)=>{
      const b=document.createElement('button');
      b.className='tab'+(i===0?' active':'');
      b.textContent=`${w.split} · ${w.body.startsWith('wall')?'wall':'floor'} · s${w.scene_id}`;
      b.addEventListener('click',()=>{
        tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        b.classList.add('active'); loadSet(w.name);
      });
      tabs.appendChild(b);
    });
    return loadSet(list[0].name);
  }).then(()=>requestAnimationFrame(loop));
  addEventListener('resize', render);
})();
</script>
</body>
</html>
