<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Sand training data</title>
<link rel="stylesheet" href="site.css?v=20260902">
<style>
  #bg{position:fixed; left:0; top:0; width:100%; height:100%; z-index:0; display:block; pointer-events:none}
  .wrap{position:relative; z-index:1; max-width:1440px}   /* wider than the article default: this page is all grid */
  .speed{font-size:12px; color:var(--soft); margin:18px 1px 0; letter-spacing:.02em}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin:10px 0 28px; cursor:grab}
  .grid:active{cursor:grabbing}
  .tile{margin:0}
  .tile .view{height:460px; border:1px solid var(--line); background:transparent}
  .tile figcaption{font-size:12px; color:var(--soft); margin:6px 1px 0}
  .tile figcaption b{color:var(--ink); font-weight:600}
  @media(max-width:900px){ .grid{grid-template-columns:1fr} .tile .view{height:340px} }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <p class="speed">Played at &frac14; speed &middot; drag to rotate</p>
  <div class="grid" id="grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="overlay.js?v=2"></script>
<script>
(function(){
  const SAND = '#d3a15a', SPEED = 4;                  // 1/4 speed: a 1.2 s clip reads as ~4.8 s
  const disc = vizDisc();
  const cm = v => (v * 100).toFixed(0);
  const v = '?t=' + Date.now();
  let tiles = [], T = 0, DT_MS = 10, frame = -1;
  const clock = makeClock(() => SPEED, 700);

  function arena(H){
    const s = new THREE.Scene();
    const g = new THREE.GridHelper(1, 10, 0xd6d2ca, 0xe6e3dc); g.position.set(0.5, 0, 0.5); s.add(g);
    const P = (a, b, c) => new THREE.Vector3(a, b, c);
    s.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([P(0,0,0), P(1,0,0), P(1,0,1), P(0,0,1)]), new THREE.LineBasicMaterial({color: 0x444444})));
    const up = new THREE.LineBasicMaterial({color: 0xb0b0b0});
    for (const [a, c] of [[0,0],[1,0],[1,1],[0,1]]) s.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P(a,0,c), P(a,H,c)]), up));
    s.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([P(0,H,0), P(1,H,0), P(1,H,1), P(0,H,1)]), new THREE.LineBasicMaterial({color: 0xcccccc})));
    return s;
  }

  const canvas = document.getElementById('bg');
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 100);
  camera.position.set(2.15, 1.15, 2.15);
  const controls = new THREE.OrbitControls(camera, document.getElementById('grid'));
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.enableZoom = false; controls.enablePan = false;      // rotate only; the page keeps scrolling normally
  controls.maxPolarAngle = Math.PI / 2 - 0.02;
  controls.target.set(0.5, 0.22, 0.5);

  function render(){
    const w = innerWidth, h = innerHeight, pr = renderer.getPixelRatio();
    if (canvas.width !== Math.floor(w * pr) || canvas.height !== Math.floor(h * pr)) renderer.setSize(w, h, false);
    renderer.setScissorTest(false);
    renderer.setClearColor(0x000000, 0); renderer.clear();       // page shows through outside the tiles
    renderer.setScissorTest(true);
    renderer.setClearColor(0xfbfaf8, 1);                         // each tile gets the paper tint
    for (const t of tiles){
      if (!t.scene) continue;
      const r = t.el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) continue;
      renderer.setViewport(r.left, innerHeight - r.bottom, r.width, r.height);
      renderer.setScissor(r.left, innerHeight - r.bottom, r.width, r.height);
      camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
      renderer.render(t.scene, camera);
    }
    renderer.setScissorTest(false);
  }
  function setFrame(f){
    frame = f;
    for (const t of tiles){
      if (!t.buf) continue;
      const base = Math.min(f, t.T - 1) * t.n * 3;
      t.geo.attributes.position.array.set(t.buf.subarray(base, base + t.n * 3));
      t.geo.attributes.position.needsUpdate = true;
    }
  }
  function loop(ts){
    controls.update();
    if (T > 0){
      const f = Math.min(T - 1, Math.round(clock.tick(ts, true, (T - 1) * DT_MS) / DT_MS));
      if (f !== frame) setFrame(f);
    }
    render();
    requestAnimationFrame(loop);
  }

  async function init(){
    let index;
    try { index = await (await fetch('data/sandtrain/index.json' + v)).json(); }
    catch (e){ document.getElementById('grid').innerHTML = '<p class="caption">Could not load data/sandtrain/index.json</p>'; return; }
    const grid = document.getElementById('grid');
    tiles = index.map(e => {
      const fig = document.createElement('figure'); fig.className = 'tile';
      fig.innerHTML = `<div class="view"></div><figcaption><b>${e.scenario}</b> · ${cm(e.height)} cm`
        + `${e.speed0 > 0.05 ? ' · ' + e.speed0.toFixed(1) + ' m/s' : ''} · spin ${e.spin0.toFixed(1)} rad/s</figcaption>`;
      grid.appendChild(fig);
      return {el: fig.querySelector('.view')};
    });
    requestAnimationFrame(loop);
    await Promise.all(index.map(async (e, i) => {
      const m = await (await fetch(`data/sandtrain/${e.stem}/meta.json` + v)).json();
      const buf = new Float32Array(await (await fetch(`data/sandtrain/${e.stem}/pos.bin` + v)).arrayBuffer());
      const t = tiles[i];
      t.n = m.n_particles; t.T = m.n_frames; t.buf = buf; DT_MS = m.dt * 1000;
      t.scene = arena(m.arena.wall_height);
      t.geo = new THREE.BufferGeometry();
      t.geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(t.n * 3), 3));
      const pts = new THREE.Points(t.geo, new THREE.PointsMaterial({size: 0.013, map: disc, color: SAND, transparent: true, alphaTest: 0.4, depthWrite: true, sizeAttenuation: true}));
      pts.frustumCulled = false; t.scene.add(pts);
      T = Math.max(T, m.n_frames);
      setFrame(Math.max(frame, 0));
    }));
  }
  init();
})();
</script>
</body>
</html>
