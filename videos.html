<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Training data</title>
<link rel="stylesheet" href="site.css">
<style>
  .wrap{max-width:1400px}
  .grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px}
  .cell{border-radius:12px; overflow:hidden; background:#000; border:1px solid var(--line)}
  video{display:block; width:100%; height:auto}
  .cap{font-size:13px; color:var(--soft); padding:7px 10px; background:#fff}
  @media(max-width:900px){ .grid{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctl" style="margin:0 0 12px"><button id="all">Play all</button><button id="pause">Pause all</button></div>
  <div class="grid" id="grid"></div>
</div>
<script>
(async function(){
  const list = await (await fetch('data/videos/index.json?t=' + Date.now())).json();
  const grid = document.getElementById('grid');
  for (const v of list) { const d = document.createElement('div'); d.className = 'cell';
    d.innerHTML = `<video src="data/videos/${v.file}" muted loop playsinline preload="metadata"></video><div class="cap">${v.label}</div>`; grid.appendChild(d); }
  const vids = [...document.querySelectorAll('video')];
  document.getElementById('all').onclick = () => vids.forEach(v => v.play());
  document.getElementById('pause').onclick = () => vids.forEach(v => v.pause());
  vids.forEach(v => { v.onclick = () => v.paused ? v.play() : v.pause(); });
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? e.target.play() : e.target.pause()), {threshold: 0.3});
  vids.forEach(v => io.observe(v));
})();
</script>
</body>
</html>
