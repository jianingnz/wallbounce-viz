<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Meetings — Particle world model</title>
<link rel="stylesheet" href="../site.css">
<style>
  body{background:#fff; color:var(--ink); font-size:15px}
  .mast{border-bottom:1px solid var(--ink); padding:18px 28px 0}
  .mast .top{display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:wrap}
  .mast h1{font-family:var(--serif); font-size:26px; font-weight:700; letter-spacing:-.01em; margin:0}
  .mast h1 small{font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); margin-left:14px}
  .mast .who{font-size:12.5px; color:var(--soft)}
  nav{display:flex; gap:2px; flex-wrap:wrap; margin-top:10px}
  nav .navlbl{font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); align-self:center; margin-right:12px; padding-bottom:9px}
  nav a{display:block; padding:6px 12px 9px; color:#444; text-decoration:none; font-size:14px; font-variant-numeric:tabular-nums; border-bottom:3px solid transparent; margin-bottom:-1px}
  nav a:hover{color:var(--ink)}
  nav a.active{color:var(--ink); font-weight:600; border-bottom-color:var(--ink)}
  main{padding:14px 28px 40px}
  .subtabs{display:flex; gap:22px; flex-wrap:wrap; margin:0 0 12px; border-bottom:1px solid var(--line)}
  .subtabs button{font:inherit; font-size:13.5px; font-weight:500; padding:8px 0 10px; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; background:none; color:#555; cursor:pointer; letter-spacing:.01em}
  .subtabs button:hover{color:var(--ink)}
  .subtabs button.active{color:var(--ink); font-weight:600; border-bottom-color:var(--ink)}
  main iframe{width:100%; height:calc(100vh - 150px); border:1px solid var(--line); background:#fff}
  @media(max-width:760px){ .mast,main{padding-left:16px; padding-right:16px} main iframe{height:calc(100vh - 190px)} }
</style>
</head>
<body>
<header class="mast">
  <div class="top">
    <h1>Particle world model <small>Meeting notes</small></h1>
    <span class="who">Δt-aware particle dynamics · Genesis MPM &amp; MOVi wall-bounce data</span>
  </div>
  <nav><span class="navlbl">Meetings</span><span id="tabs" style="display:contents"></span></nav>
</header>
<main id="main">loading…</main>
<script>
(async function(){
  const idx = await (await fetch('meetings.json?t=' + Date.now())).json();
  const tabs = document.getElementById('tabs');
  const main = document.getElementById('main');
  function show(m){
    tabs.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.id === m.id));
    main.innerHTML = '<div class="subtabs" id="subtabs"></div><iframe id="viz" title=""></iframe>';
    const sub = document.getElementById('subtabs'), fr = document.getElementById('viz');
    const pick = (it, i) => { sub.querySelectorAll('button').forEach((b, j) => b.classList.toggle('active', j === i));
                              fr.src = it.src + (it.src.includes('?') ? '&' : '?') + 'v=' + Date.now(); fr.title = it.label; };
    (m.items || []).forEach((it, i) => { const b = document.createElement('button'); b.textContent = it.label;
                                        b.onclick = () => pick(it, i); sub.appendChild(b); });
    if (m.items && m.items.length) pick(m.items[0], 0);
    history.replaceState(null, '', '#' + m.id);
    window.scrollTo(0, 0);
  }
  idx.meetings.forEach(m => {
    const a = document.createElement('a'); a.href = '#' + m.id; a.dataset.id = m.id;
    a.textContent = m.date;
    a.onclick = e => { e.preventDefault(); show(m); };
    tabs.appendChild(a);
  });
  const want = location.hash.slice(1);
  show(idx.meetings.find(m => m.id === want) || idx.meetings[idx.meetings.length - 1]);
})();
</script>
</body>
</html>
